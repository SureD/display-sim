[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-sim"
version = "0.1.0"
description = "Reference TV display simulator (linear-light NumPy pipeline)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SureD"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/SureD/display-sim"
Issues = "https://github.com/SureD/display-sim/issues"
Documentation = "https://github.com/SureD/display-sim/blob/main/docs/index.md"
Changelog = "https://github.com/SureD/display-sim/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    # NumPy includes its type stubs; use one Python-3.11-compatible version in CI.
    "numpy==2.4.6",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
    "pytest==8.4.2",
    "ruff==0.14.1",
    "mypy==1.18.2",
    "types-PyYAML==6.0.12.20250915",
    "pre-commit==4.3.0",
    "build==1.3.0",
    "matplotlib==3.11.2",
]

[project.scripts]
tv-sim = "tv_sim.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["tv_sim*", "sim"]
namespaces = false

[tool.setuptools.package-data]
tv_sim = ["profiles/*.yaml", "data/measurements/*.json", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long prose/URLs remain readable; existing zip truncation is intentional.
ignore = ["E501", "B905"]

[tool.mypy]
files = ["src", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: full-resolution golden, gallery, export or experiment integration checks",
    "golden: captured output, pixel, array or report parity checks",
    "e2e: command-line or whole-pipeline end-to-end checks",
]
