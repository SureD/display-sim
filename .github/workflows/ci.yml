name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint typecheck docs-check
      - run: python -m build
      - name: Smoke-test installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          tv-sim --help
          python -m tv_sim provenance --check
          python -m sim --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint typecheck docs-check
      - run: python -m pytest -q
      - name: Installed CLI and bundled evidence
        run: |
          cd "$RUNNER_TEMP"
          tv-sim --help
          python -m tv_sim provenance --check
