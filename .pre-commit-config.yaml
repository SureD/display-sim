repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: docs-check
        name: Check local documentation links
        entry: python3 scripts/check_docs.py
        language: system
        pass_filenames: false
        files: '\.(md|html)$'
